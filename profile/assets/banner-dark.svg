<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="bobuk.io — Less noise. More of your own work.">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .ink{fill:#f0eee6}.muted{fill:#a3a797}.orange{fill:#dd572f}.paper{fill:#1b1d18}.white{fill:#fffdf7}
    .line{stroke:#34372f}
    .cap{fill:#2a2d26;stroke:#3d4137;stroke-width:1.5}
    .capShade{fill:#121410}
  </style>
  <rect width="1280" height="360" rx="20" class="paper"/>
  <!-- brand -->
  <g transform="translate(64 56)">
    <svg width="40" height="40" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#dd572f"/><path d="M19 14h7v17c3-5 14-5 18 1 5 8 2 21-9 21-5 0-8-2-9-4v3h-7zm15 20c-11 0-11 14 0 14 9 0 9-14 0-14" fill="#fffaf0"/><circle cx="51" cy="49" r="4" fill="#fffaf0"/></svg>
    <text x="54" y="29" class="sans ink" font-size="27" font-weight="650" letter-spacing="-1.2">bobuk<tspan class="muted" font-weight="450">.io</tspan></text>
  </g>
  <g transform="translate(64 148)" class="sans">
    <rect y="-4" width="25" height="3" class="orange"/>
    <text x="38" y="0" class="muted" font-size="13" font-weight="600" letter-spacing="1">INDEPENDENT APPS · PUBLIC SOURCE CODE</text>
    <text y="72" class="ink" font-size="64" font-weight="600" letter-spacing="-1.8">Less noise.</text>
    <text y="146" class="muted" font-size="64" font-weight="500" letter-spacing="-1.8">More of your own work.</text>
  </g>
  <!-- motif: keycaps -->
  <g transform="translate(880 92)" class="sans">
    <g transform="translate(64 0)">
      <rect x="0" y="6" width="88" height="88" rx="16" class="capShade"/>
      <rect x="0" y="0" width="88" height="86" rx="16" class="cap"/>
      <text x="44" y="56" text-anchor="middle" class="ink" font-size="30" font-weight="550">⌥</text>
    </g>
    <g transform="translate(168 0)">
      <rect x="0" y="6" width="88" height="88" rx="16" fill="#bf3e1b"/>
      <rect x="0" y="0" width="88" height="86" rx="16" class="orange"/>
      <text x="44" y="57" text-anchor="middle" class="white" font-size="32" font-weight="650">b</text>
    </g>
    <g transform="translate(116 110)">
      <rect x="0" y="6" width="88" height="88" rx="16" class="capShade"/>
      <rect x="0" y="0" width="88" height="86" rx="16" class="cap"/>
      <text x="44" y="56" text-anchor="middle" class="ink" font-size="28" font-weight="550">io</text>
    </g>
    <g transform="translate(220 110)">
      <rect x="0" y="6" width="88" height="88" rx="16" class="capShade" opacity=".6"/>
      <rect x="0" y="0" width="88" height="86" rx="16" class="cap" stroke-dasharray="5 5"/>
      <text x="44" y="56" text-anchor="middle" class="muted" font-size="24" font-weight="500">…</text>
    </g>
  </g>
  <line x1="64" y1="318" x2="1216" y2="318" class="line" stroke-width="1"/>
  <text x="64" y="342" class="sans muted" font-size="13">macOS · Swift · made in the open</text>
  <text x="1216" y="342" text-anchor="end" class="sans muted" font-size="13">bobuk.io</text>
</svg>
